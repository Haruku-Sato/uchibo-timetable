<div class="wrap">
  <header><span class="badge">JO 内房線</span><h1>千葉〜君津 乗換検索</h1></header>

  <form id="f">
    <div class="stations">
      <label for="from">出発駅<select id="from"></select></label>
      <button type="button" class="swap" id="swap" aria-label="出発駅と到着駅を入れ替え">⇄</button>
      <label for="to">到着駅<select id="to"></select></label>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="検索方法">
        <button type="button" id="mDep" aria-pressed="true">出発</button>
        <button type="button" id="mArr" aria-pressed="false">到着</button>
      </div>
      <label class="time" for="time">時刻<input type="time" id="time" value="09:00"></label>
      <button type="button" class="now" id="now">現在時刻</button>
      <label class="margin" for="margin">乗換余裕<select id="margin">
        <option value="1">1分</option><option value="2" selected>2分</option><option value="3">3分</option><option value="5">5分</option><option value="8">8分</option>
      </select></label>
    </div>
  </form>

  <p class="summary" id="summary"></p>
  <div id="results"></div>

  <footer>
    <p>時刻表：JR東日本千葉事業本部 臨時ダイヤ（千葉〜姉ヶ崎 9/24現在、長浦〜君津 10/3現在）。</p>
    <p>長浦〜姉ヶ崎はバスで25分（待ち時間込み）として計算しています。バスの実際の時刻は反映していません。</p>
    <p>君津着は時刻表に載っていないため、君津発の時刻（停車が長い便は木更津発＋7分）で推定しています。</p>
    <p>電力設備の影響で、千葉〜姉ヶ崎間は遅れが出ることがあります。乗換が2分以下の便は余裕を見てください。</p>
  </footer>
</div>

    if(o<0) return;
    const a=time+BUS_MIN;
    if(a<arr[o]){arr[o]=a;board[o]=a+margin;ptr[o]={bus:true,from:s,dep:time,arr:a};}
  };
  relaxBus(origin,t);
  for(const c of conns){
    if(c.dep<t) continue;
    if(arr[dest]<=c.dep) break;
    const onTrip=tripIn.has(c.trip);
    if(!onTrip && board[c.from]>c.dep) continue;
    if(!onTrip) tripIn.set(c.trip,c);
    if(c.arr<arr[c.to]){
      arr[c.to]=c.arr; board[c.to]=c.arr+margin;
      ptr[c.to]={bus:false,enter:tripIn.get(c.trip),exit:c};
      relaxBus(c.to,c.arr);
    }
  }
  if(arr[dest]>=INF) return null;
  const legs=[]; let s=dest, guard=0;
  while(s!==origin && guard++<20){
    const p=ptr[s];
    if(p.bus){legs.unshift({type:"bus",from:p.from,to:s,dep:p.dep,arr:p.arr});s=p.from;}
    else{legs.unshift({type:"train",from:p.enter.from,to:s,dep:p.enter.dep,arr:p.exit.arr});s=p.enter.from;}
  }
  return {dep:legs[0].dep,arr:arr[dest],legs};
}
function journeys(origin,dest,mode,time,margin){
  const map=new Map();
  const span=7*60;
  const lo=mode==="dep"?time:time-span, hi=mode==="dep"?time+span:time;
  for(let t=lo;t<=hi;t++){
    const j=earliest(origin,dest,t,margin);
    if(!j) continue;
    if(mode==="arr" && j.arr>time) continue;
    const prev=map.get(j.arr);
    if(!prev||j.dep>prev.dep) map.set(j.arr,j);
  }
  // drop journeys dominated (leave earlier and arrive later is fine; leave earlier & arrive same/later than one leaving later = dominated)
  let list=[...map.values()].sort((a,b)=>a.dep-b.dep);
  list=list.filter(j=>!list.some(k=>k!==j&&k.dep>=j.dep&&k.arr<=j.arr));
  if(list.length&&list.every(j=>j.legs.every(l=>l.type==="bus"))) return mode==="dep"?list.slice(0,1):list.slice(-1);
  if(mode==="dep") return list.slice(0,6);
  return list.reverse().slice(0,6);
}

/* ===== UI ===== */
const $=id=>document.getElementById(id);
const fromSel=$("from"), toSel=$("to");
ST.forEach((n,i)=>{fromSel.add(new Option(n,i));toSel.add(new Option(n,i));});
let mode="dep";
function load(){try{return JSON.parse(localStorage.getItem("uchibo-search")||"{}");}catch(e){return {};}}
function save(){try{localStorage.setItem("uchibo-search",JSON.stringify({from:fromSel.value,to:toSel.value,mode,margin:$("margin").value}));}catch(e){}}
const saved=load();
fromSel.value=saved.from??"11"; toSel.value=saved.to??"0";
if(saved.margin) $("margin").value=saved.margin;
if(saved.mode) mode=saved.mode;
function nowStr(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
$("time").value=nowStr();
function setMode(m){mode=m;$("mDep").setAttribute("aria-pressed",m==="dep");$("mArr").setAttribute("aria-pressed",m==="arr");run();}
$("mDep").onclick=()=>setMode("dep");
$("mArr").onclick=()=>setMode("arr");
$("swap").onclick=()=>{const a=fromSel.value;fromSel.value=toSel.value;toSel.value=a;run();};
$("now").onclick=()=>{$("time").value=nowStr();run();};
[fromSel,toSel,$("time"),$("margin")].forEach(el=>el.addEventListener("change",run));
$("f").addEventListener("submit",e=>{e.preventDefault();run();});

function durStr(m){const h=Math.floor(m/60),mm=m%60;return h?`${h}時間${mm}分`:`${mm}分`;}
function esc(s){return String(s);}
function render(j,i){
  const transfers=j.legs.filter(l=>l.type==="train").length-1;
  const hasBus=j.legs.some(l=>l.type==="bus");
  let tight=false;
  let html="";
  j.legs.forEach((l,k)=>{
    if(k===0) html+=`<li class="stop"><span class="tm">${fmt(l.dep)}</span><span class="dot"></span><span class="nm">${ST[l.from]} 発</span></li>`;
    else{
      const w=l.dep-j.legs[k-1].arr;
      const t=w<=2; if(t) tight=true;
      html+=`<li class="stop"><span class="tm">${fmt(l.dep)}</span><span class="dot"></span><span class="nm">${ST[l.from]} 発</span></li>`;
    }
    const isBus=l.type==="bus";
    html+=`<li class="seg-line${isBus?" bus":""}"><span></span><span class="bar"></span><span class="info">${isBus?"バス（25分想定）":L_NAI+"　"+(l.arr-l.dep)+"分"}</span></li>`;
    html+=`<li class="stop"><span class="tm">${fmt(l.arr)}</span><span class="dot"></span><span class="nm">${ST[l.to]} 着${l.to===11&&!isBus?"（推定）":""}</span></li>`;
    if(k<j.legs.length-1){
      const w=j.legs[k+1].dep-l.arr;
      html+=`<li class="wait${w<=2?" tight":""}"><span></span><span class="bar"></span><span>乗換 ${w}分${w<=2?"・ギリギリ":""}</span></li>`;
    }
  });
  const label = mode==="arr"&&i===0?'<span class="chip tag">最終</span>':mode==="dep"&&i===0?'<span class="chip tag">先発</span>':"";
  return `<article class="card${i===0?" best":""}">
    <div class="top"><span class="t">${fmt(j.dep)}</span><span class="arrow">→</span><span class="t">${fmt(j.arr)}</span>
      <span class="dur"><b>${durStr(j.arr-j.dep)}</b></span></div>
    <div class="chips">${label}<span class="chip">乗換${Math.max(0,transfers)+(hasBus?1:0)}回</span>${hasBus?'<span class="chip">バス利用</span>':""}${tight?'<span class="chip warn">乗換2分以下あり</span>':""}</div>
    <details${i===0?" open":""}><summary>経路を見る</summary><ol class="legs">${html}</ol></details>
  </article>`;
}
function run(){
  save();
  const o=+fromSel.value, d=+toSel.value, margin=+$("margin").value;
  const tv=$("time").value||"09:00";
  const [h,m]=tv.split(":").map(Number);
  const time=(h<4?h+24:h)*60+m;
  const res=$("results");
  if(o===d){res.innerHTML='<div class="empty">出発駅と到着駅が同じです。別の駅を選んでください。</div>';$("summary").textContent="";return;}
  const list=journeys(o,d,mode,time,margin);
  $("summary").textContent=`${ST[o]} → ${ST[d]}　${fmt(time)} ${mode==="dep"?"以降に出発":"までに到着"}　（乗換余裕${margin}分）`;
  if(!list.length){res.innerHTML=`<div class="empty">${mode==="dep"?"この時刻以降に乗れる列車がありません。":"この時刻までに着ける列車がありません。"}時刻を変えてみてください。</div>`;return;}
  res.innerHTML=list.map(render).join("");
}
setMode(mode);
</script>
